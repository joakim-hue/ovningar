<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modul 3 · Lagar och ansvar | Ja&Ja</title><style>
:root{--ink:#173e3b;--muted:#526662;--paper:#f5f3ec;--teal:#185b50;--line:#d3ddd5;--warm:#9a452d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}header{border-bottom:1px solid var(--line);padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:20px}header b{font-size:23px}header span{font-size:14px}main{max-width:1100px;margin:auto;padding:48px 24px 64px}h1,h2,h3{line-height:1.15;letter-spacing:-.025em}h1{font-size:clamp(36px,6vw,66px);margin:15px 0 24px;max-width:760px}h2{font-size:clamp(28px,4vw,42px);margin:12px 0 24px}h3{font-size:23px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:750;color:var(--warm)}.lead{font-size:20px;max-width:740px;color:var(--muted)}.chips{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 36px}.chips span{background:#e6ebe1;border-radius:30px;padding:6px 15px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{border:1px solid var(--line);background:#fff;padding:28px;border-radius:16px;display:flex;flex-direction:column}.card p{color:var(--muted);flex:1}.number{font-size:42px;color:var(--teal);font-weight:300}.card button{margin-top:12px}.small{font-size:14px;color:var(--muted)}button{font:inherit;font-weight:650;border:1px solid transparent;border-radius:8px;background:var(--teal);color:#fff;padding:12px 20px;cursor:pointer;min-height:48px}button:hover{background:#123f38}button:disabled{cursor:default;background:#dae0dc;color:#59675f}button.secondary{color:var(--ink);background:transparent;border-color:var(--line)}button.secondary:hover{background:#e8eee8}:focus-visible{outline:3px solid #bd5e27;outline-offset:4px}a{color:var(--teal);text-underline-offset:3px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.panel{max-width:800px;margin:28px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(22px,5vw,48px)}progress{width:100%;height:8px;accent-color:var(--teal);display:block;margin:20px 0}.scene{border-left:3px solid #b66d4f;padding:4px 0 4px 20px;margin:24px 0;color:#364e49}fieldset{border:0;padding:0;margin:24px 0}legend{font-weight:700;margin-bottom:18px;font-size:20px}.option{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);border-radius:9px;padding:15px;margin:12px 0;cursor:pointer}.option:has(input:checked){border:2px solid var(--teal);padding:14px;background:#eef6f1}.option input{margin-top:7px;width:18px;height:18px;flex-shrink:0;accent-color:var(--teal)}.option.right{border-color:#2a7650;background:#edf6ef}.feedback{border-radius:10px;padding:20px;background:#edf4ee;border-left:4px solid #398558;margin:24px 0}.feedback.wrong{background:#fff4e9;border-color:#b66532}.feedback p{margin:8px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}.score{font-size:64px;line-height:1;color:var(--teal);font-weight:750;margin:24px 0}.review{border-top:1px solid var(--line);padding:20px 0}.review h3{font-size:20px}details{border-top:1px solid var(--line);margin-top:40px;padding-top:18px}summary{cursor:pointer;font-weight:650}footer{max-width:1100px;margin:0 auto;padding:24px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:28px 18px}.top{align-items:flex-start;flex-direction:column}header span{max-width:160px;text-align:right}.panel{margin-top:20px}.card{padding:22px}}@media print{button,header,progress{display:none}main{padding:0}.panel{border:0;max-width:none}.review{break-inside:avoid}}
</style></head><body><header><b>Ja&Ja<span aria-hidden="true"> / </span></b><span>Palliativ omvårdnad · Modul 3</span></header><main id="app"></main><noscript><p>Övningarna behöver JavaScript. Aktivera det i webbläsaren och öppna sidan igen.</p></noscript><footer>Ja&Ja AB · Övningar till kunskapsstödet för modul 3 · September 2026<br>Frågorna är konstruerade för undervisning. Följ verksamhetens rutiner och ta hjälp av ansvarig personal i verkliga vårdsituationer.</footer><script>
'use strict';
const groups=[{"title": "Vilken regel gäller?", "tag": "Förstå reglerna", "desc": "Skilj lag, förordning, föreskrift och lokal rutin åt.", "questions": [["Vem bestämmer?", "Du läser hälso- och sjukvårdsförordningen och undrar vem som har beslutat om den.", "Vem beslutar om svenska förordningar?", ["Riksdagen.", "Regeringen.", "Verksamhetschefen."], 1, ["Riksdagen beslutar om lagar. Förordningar beslutas av regeringen.", "Regeringen beslutar om förordningar, som kan komplettera lagarnas bestämmelser.", "Verksamhetschefen kan ansvara för lokala arbetssätt men beslutar inte om svenska förordningar."], "Kunskapsstödet s. 2–3"], ["Rutin eller rättighet?", "En kollega säger: ”Vår lokala rutin säger att vi alltid ska genomföra åtgärden, även när patienten säger nej.”", "Hur bör du förhålla dig till rutinen?", ["Följa den eftersom lokala rutiner alltid har företräde.", "Be en närstående godkänna åtgärden i patientens ställe.", "Uppmärksamma konflikten och ta den vidare till ansvarig personal."], 2, ["En lokal rutin får inte sätta lagliga rättigheter åt sidan. Ta upp konflikten med ansvarig personal.", "Närstående ersätter inte automatiskt en vuxen patients samtycke.", "Rutinen ska följa överordnade regler. Lyft oklarheten och utgå från patientens självbestämmande."], "Kunskapsstödet s. 2 och 4; patientlagen 4 kap."], ["Läs rubriken noga", "I ett myndighetsdokument finns både föreskrifter och allmänna råd.", "Vilket påstående beskriver skillnaden?", ["Föreskrifter är bindande; allmänna råd är rekommendationer.", "Båda är frivilliga om arbetsplatsen har en egen rutin.", "Allmänna råd är bindande; föreskrifter är exempel."], 0, ["En myndighet kan meddela bindande föreskrifter med stöd av bemyndigande. Allmänna råd ger vägledning.", "En lokal rutin gör inte en bindande föreskrift frivillig.", "Det är tvärtom: föreskrifter är bindande, medan allmänna råd är rekommendationer."], "Kunskapsstödet s. 2"], ["Samma hem, olika uppgifter", "Ali får hjälp med duschen från hemtjänsten och medicinska insatser från hemsjukvården.", "Vad avgör vilket regelverk som gäller för en insats?", ["Att all hjälp sker i Alis bostad.", "Uppgiftens innehåll och rättsliga grund.", "Vilken personal som först kommer till bostaden."], 1, ["Platsen räcker inte för att avgöra regelverket. Omsorg och hälso- och sjukvård kan ges i samma hem.", "Omsorg och medicinsk vård kan omfattas av olika regler trots att båda ges hemma.", "Ankomstordningen avgör inte vilket regelverk som gäller. Insatsens innehåll och rättsliga grund är avgörande."], "Kunskapsstödet s. 3"]]}, {"title": "Patientens rättigheter", "tag": "Möt människan", "desc": "Öva på samtycke, delaktighet, sekretess och journalåtkomst.", "questions": [["Eva vill inte just nu", "Eva vänder bort huvudet när du erbjuder munvård. Hennes son föreslår att ni håller fast henne.", "Vad är det bästa nästa steget?", ["Genomföra munvården eftersom sonen samtycker.", "Avstå från all framtida munvård utan uppföljning.", "Pausa, undersöka vad som besvärar Eva och anpassa hjälpen."], 2, ["Sonens önskemål ger inte rätt att hålla fast Eva. Uppmärksamma hennes vilja och ta hjälp vid behov.", "Ett nej nu betyder inte att alla framtida behov försvinner. Anpassa och följ upp.", "Pausa och försök förstå motståndet. Anpassa tidpunkt och bemötande samt rapportera smärta eller andra hinder till sjuksköterskan."], "Kunskapsstödet s. 4; patientlagen 4 kap."], ["Ett ja kan ändras", "En patient som kan ta ställning tackade tidigare ja till en åtgärd. Nu säger patienten tydligt nej.", "Vilken utgångspunkt är riktig?", ["Patienten kan ta tillbaka sitt samtycke.", "Det tidigare samtycket gäller tills vårdperioden slutar.", "Samtycke kan bara tas tillbaka skriftligt."], 0, ["Samtycke kan återkallas. Patienten behöver anpassad information om möjliga konsekvenser av att avstå.", "Samtycke gäller den aktuella åtgärden och kan tas tillbaka.", "Det krävs inte generellt en skriftlig återkallelse för att ett tydligt nej ska respekteras."], "Kunskapsstödet s. 4; patientlagen 4 kap. 2 §"], ["En anhörig ringer", "En person presenterar sig som patientens dotter och vill veta vad läkaren har skrivit. Du vet inte vilken information patienten vill dela.", "Hur går du vidare?", ["Läser upp anteckningen eftersom hon säger att hon är dottern.", "Följer rutinen för identitet, samtycke och sekretessprövning.", "Säger att närstående aldrig får information om vården."], 1, ["Släktskap innebär inte automatisk rätt till alla journaluppgifter. Kontrollera enligt verksamhetens rutiner.", "Kontrollera vem du talar med och förutsättningarna för att lämna information. Hjälp henne till rätt kontakt utan att röja uppgifter i förtid.", "Närstående kan få information när förutsättningarna är uppfyllda. Ett generellt förbud är inte rätt."], "Kunskapsstödet s. 5; patientlagen 3 kap. 4–5 §§"], ["Teknisk åtkomst", "Du upptäcker att en gammal granne är patient. Journalsystemet låter dig öppna journalen, men du deltar inte i vården och behöver inte uppgifterna i arbetet.", "Får du läsa för att se hur grannen mår?", ["Ja, om du inte berättar det för någon.", "Ja, om du bara läser den senaste anteckningen.", "Nej, teknisk åtkomst räcker inte som skäl."], 2, ["Tystnadsplikt gör inte en obehörig läsning tillåten. Även åtkomsten måste vara motiverad av arbetet.", "Hur lite du läser ändrar inte kravet på arbetsrelaterat behov.", "Du får ta del av uppgifter när du deltar i vården eller annars behöver dem i arbetet. Nyfikenhet är inte ett sådant behov."], "Kunskapsstödet s. 5; patientdatalagen 4 kap. 1 §"]]}, {"title": "Ansvar i vardagen", "tag": "Välj nästa steg", "desc": "Träna på läkemedel, rapportering och begrepp vid livets slut.", "questions": [["En dos saknas", "Du upptäcker att en ordinerad dos inte har getts. Patienten berättar att hen har ont.", "Vad gör du först?", ["Kontaktar sjuksköterskan direkt för bedömning.", "Ger en extra dos för att kompensera det som saknas.", "Skriver en avvikelse och väntar till nästa rapport."], 0, ["Patientens behov behöver bedömas direkt. Dokumentera och rapportera också avvikelsen enligt rutinen.", "Du ändrar inte ordinationen eller kompenserar en utebliven dos på eget initiativ. Kontakta sjuksköterskan.", "Avvikelserapportering behövs, men ersätter inte direkt kontakt om patientens aktuella behov."], "Kunskapsstödet s. 5"], ["En ny arbetsplats", "Du har haft läkemedelsdelegering på din tidigare arbetsplats. På det nya boendet ber en kollega dig dela läkemedel.", "Vad behöver du göra?", ["Använda det gamla beslutet eftersom uppgiften känns bekant.", "Kontrollera uppdrag, kompetens och giltig delegering med ansvarig sjuksköterska.", "Be kollegan muntligt föra över sin delegering till dig."], 1, ["Ett tidigare beslut gäller inte automatiskt i en ny verksamhet.", "Kontrollera att uppgiften omfattas av ett giltigt personligt beslut när delegering krävs. Erfarenhet ensam ersätter inte detta.", "Delegering är personlig och kan inte överlåtas av en kollega."], "Kunskapsstödet s. 5"], ["Ett avgränsat beslut", "På rapporten sägs: ”Patienten har Ej HLR. Då ska väl all annan vård också upphöra?”", "Vilket svar är riktigt?", ["Ja, beslutet avslutar alla medicinska insatser.", "Ja, men vanlig omsorg får fortsätta om familjen begär det.", "Nej, beslutet gäller HLR vid hjärtstopp; övrig vård bedöms separat."], 2, ["Ej HLR innebär inte automatiskt att annan behandling eller symtomlindring avslutas.", "Omsorg och lindring upphör inte på grund av ett Ej HLR-beslut och kräver inte en särskild begäran från familjen.", "Beslutet är avgränsat. Andra behandlingsbegränsningar kräver egna tydliga ställningstaganden, och omvårdnad och lindring fortsätter."], "Kunskapsstödet s. 6"], ["Begrepp i debatten", "Under ett seminarium säger någon att palliativ sedering och eutanasi betyder samma sak.", "Vilken skillnad behöver ni reda ut?", ["Sedering syftar till symtomlindring; eutanasi avser en handling med avsikt att avsluta livet.", "Sedering får beslutas av undersköterskan; eutanasi kräver läkare.", "Begreppen skiljer sig bara genom vilket land man befinner sig i."], 0, ["Avsikt, indikation och genomförande behöver skiljas åt. Palliativ sedering kräver medicinsk bedömning och uppföljning.", "Undersköterskan beslutar inte om palliativ sedering.", "Begreppen beskriver olika åtgärder. Länder kan ha olika lagstiftning, men det gör inte åtgärderna likadana."], "Kunskapsstödet s. 7–8"]]}];
const app=document.getElementById('app');
let active=0,index=0,queue=[],answers=[],checked=false,finished={};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function focusTitle(){const h=app.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus();}window.scrollTo(0,0);}
function home(){app.innerHTML=`<div class="eyebrow">Kunskap som gör skillnad i vardagen</div><h1>Lagar, rättigheter<br>och kloka nästa steg.</h1><p class="lead">Vad gäller – och vad gör du? Träna på regler och vardagssituationer i palliativ vård. Välj en övning och resonera dig fram.</p><div class="chips"><span>3 korta övningar</span><span>4 frågor per övning</span><span>Återkoppling direkt</span></div><div class="grid">${groups.map((g,i)=>`<article class="card"><span class="number">0${i+1}</span><div class="eyebrow">${g.tag}</div><h2 style="font-size:27px">${g.title}</h2><p>${g.desc}</p><span class="small">${finished[i]===undefined?'Cirka 3–5 minuter':`Senast: ${finished[i]} av 4 rätt`}</span><button data-start="${i}">${finished[i]===undefined?'Starta övningen':'Gör övningen igen'} <span aria-hidden="true">→</span></button></article>`).join('')}</div><p class="small">Självstudier utan betyg. Dina svar skickas inte till läraren eller itslearning. Resultatet finns bara kvar tills sidan laddas om eller stängs.</p><details><summary>Så fungerar övningarna och källorna</summary><p>Välj ett svar och tryck på <b>Visa återkoppling</b>. Läs förklaringen och gå vidare. Fel svar stoppar dig inte. Efteråt kan du repetera det du missade eller börja om.</p><p>Underlag: <i>Kunskapsstöd Modul 3 – Lagar och ansvar i palliativ vård</i>, Ja&Ja AB, september 2026. Sidangivelser visas efter varje fråga. Övningarna täcker ett urval av modulens innehåll.</p><p>Fördjupning: <a href="https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/patientlag-2014821_sfs-2014-821/" target="_blank" rel="noopener">Patientlagen</a>, <a href="https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/patientdatalag-2008355_sfs-2008-355/" target="_blank" rel="noopener">patientdatalagen</a> och <a href="https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/patientsakerhetslag-2010659_sfs-2010-659/" target="_blank" rel="noopener">patientsäkerhetslagen</a>. Länkar öppnas i en ny flik. Läs den lydelse som gäller för aktuell tidpunkt.</p></details>`;app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(Number(b.dataset.start)));focusTitle();}
function start(g,subset){active=g;queue=subset||groups[g].questions.map((_,i)=>i);index=0;answers=[];show();}
function show(){checked=false;const q=groups[active].questions[queue[index]];app.innerHTML=`<div class="top"><button class="secondary" id="home">← Alla övningar</button><span class="small">${esc(groups[active].title)} · ${index+1} av ${queue.length}</span></div><div class="panel"><div class="eyebrow">${queue.length<4?'Repetition':'Övning '+(active+1)}</div><progress value="${index}" max="${queue.length}" aria-label="Besvarade frågor"></progress><h2>${esc(q[0])}</h2><p class="scene">${esc(q[1])}</p><form id="form"><fieldset><legend>${esc(q[2])}</legend>${q[3].map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" required><span>${esc(o)}</span></label>`).join('')}</fieldset><button id="check" type="submit">Visa återkoppling</button></form><div id="feedback" role="status" aria-live="polite"></div><button id="next" hidden>${index+1===queue.length?'Visa sammanfattning':'Nästa fråga →'}</button></div>`;document.getElementById('home').onclick=home;document.getElementById('form').onsubmit=e=>{e.preventDefault();check();};document.getElementById('next').onclick=()=>{if(!checked)return;if(++index<queue.length)show();else result();};focusTitle();}
function check(){if(checked)return;const selected=app.querySelector('input:checked');if(!selected)return;checked=true;const q=groups[active].questions[queue[index]],chosen=Number(selected.value),ok=chosen===q[4];answers.push({id:queue[index],chosen,ok});app.querySelectorAll('input').forEach(x=>x.disabled=true);document.getElementById('check').hidden=true;app.querySelectorAll('.option')[q[4]].classList.add('right');document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'':'wrong'}"><strong>${ok?'Rätt tänkt.':'Här behöver du tänka om.'}</strong><p>${esc(q[5][chosen])}</p>${ok?'':`<p><b>Rätt svar:</b> ${esc(q[3][q[4]])}</p>`}<p class="small">Läs vidare: ${esc(q[6])}</p></div>`;document.getElementById('next').hidden=false;app.querySelector('progress').value=index+1;document.getElementById('next').focus();}
function result(){const score=answers.filter(a=>a.ok).length,missed=answers.filter(a=>!a.ok).map(a=>a.id);if(queue.length===4)finished[active]=score;app.innerHTML=`<div class="panel"><div class="eyebrow">Övningen är avslutad</div><h2>Ta med dig detta.</h2><div class="score">${score} <span style="font-size:23px">av ${queue.length} rätt</span></div><p>${missed.length?'Läs förklaringarna nedan. Du kan repetera frågorna du missade i lugn och ro.':'Du valde rätt i alla situationer. Fundera på hur du kan använda kunskapen på din arbetsplats.'}</p>${answers.map(a=>{const q=groups[active].questions[a.id];return `<section class="review"><h3>${a.ok?'Rätt':'Att repetera'} · ${esc(q[0])}</h3><p><b>Ditt svar:</b> ${esc(q[3][a.chosen])}</p><p><b>Att komma ihåg:</b> ${esc(q[5][q[4]])}</p><p class="small">${esc(q[6])}</p></section>`;}).join('')}<div class="actions">${missed.length?'<button id="repeat">Öva på det jag missade</button>':''}<button class="secondary" id="restart">Gör hela övningen igen</button><button class="secondary" id="home">Alla övningar</button></div></div>`;if(missed.length)document.getElementById('repeat').onclick=()=>start(active,missed);document.getElementById('restart').onclick=()=>start(active);document.getElementById('home').onclick=home;focusTitle();}
home();
</script></body></html>
